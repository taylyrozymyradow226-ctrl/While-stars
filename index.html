<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Stars Wheel</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
    
    /* Header */
    .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .balance-box { background: #1e293b; padding: 8px 14px; border-radius: 20px; font-weight: bold; border: 1px solid #38bdf8; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .lang-select { background: #1e293b; color: #fff; border: 1px solid #475569; padding: 6px 10px; border-radius: 8px; outline: none; cursor: pointer; }

    /* Star Tier Buttons */
    .tier-container { display: flex; gap: 8px; width: 100%; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .tier-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; flex: 1; text-align: center; }
    .tier-btn.active { background: #2563eb; color: #fff; border-color: #60a5fa; }

    /* Wheel Area */
    .wheel-wrapper { position: relative; width: 280px; height: 280px; margin: 10px 0; }
    .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 24px solid #ef4444; z-index: 10; }
    .wheel { width: 100%; height: 100%; border-radius: 50%; border: 4px solid #38bdf8; position: relative; overflow: hidden; transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 0.99); background: conic-gradient(#1e293b 0deg 36deg, #0f172a 36deg 72deg, #1e293b 72deg 108deg, #0f172a 108deg 144deg, #1e293b 144deg 180deg, #0f172a 180deg 216deg, #1e293b 216deg 252deg, #0f172a 252deg 288deg, #1e293b 288deg 324deg, #0f172a 324deg 360deg); }
    
    .wheel-item { position: absolute; width: 50%; height: 50%; transform-origin: 100% 100%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; text-align: center; padding: 5px; color: #f1f5f9; }

    /* Control Buttons */
    .spin-btn { width: 100%; background: linear-gradient(135deg, #eab308, #ca8a04); color: #000; font-weight: bold; font-size: 18px; padding: 14px; border: none; border-radius: 12px; margin-top: 15px; cursor: pointer; box-shadow: 0 4px 14px rgba(234, 179, 8, 0.4); }
    .topup-btn { width: 100%; background: #10b981; color: #fff; font-weight: bold; font-size: 14px; padding: 12px; border: none; border-radius: 10px; margin-top: 8px; cursor: pointer; }

    /* Modal Notice */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-content { background: #1e293b; padding: 20px; border-radius: 16px; text-align: center; max-width: 300px; border: 1px solid #475569; }
    .modal-content h3 { color: #f43f5e; margin-bottom: 8px; }
    .modal-content p { font-size: 14px; color: #cbd5e1; margin-bottom: 15px; }
    .modal-btn { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="balance-box">
      <span>⭐ <span id="balance">0</span> Stars</span>
    </div>
    <select class="lang-select" id="langSelect" onchange="changeLanguage()">
      <option value="tk">Tkm</option>
      <option value="ru">Rus</option>
      <option value="en">Inlis</option>
      <option value="uz">Özbek</option>
      <option value="tr">Turkce</option>
      <option value="ar">Arapca</option>
      <option value="az">Azarbeycan</option>
      <option value="fr">Fransuz</option>
      <option value="kk">Kazak</option>
    </select>
  </div>

  <!-- Wheel Tier Selection -->
  <div class="tier-container">
    <button class="tier-btn active" onclick="selectTier(15, this)">15 ⭐</button>
    <button class="tier-btn" onclick="selectTier(30, this)">30 ⭐</button>
    <button class="tier-btn" onclick="selectTier(50, this)">50 ⭐</button>
    <button class="tier-btn" onclick="selectTier(100, this)">100 ⭐</button>
    <button class="tier-btn" onclick="selectTier(500, this)">500 ⭐</button>
  </div>

  <!-- Wheel -->
  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
  </div>

  <!-- Buttons -->
  <button class="spin-btn" id="spinBtn" onclick="spinWheel()">ÇARKI AÝLA (15 ⭐)</button>
  <button class="topup-btn" id="topupBtn" onclick="topUpBalance()">BALANS DOLDUR (15 ⭐)</button>

  <!-- Result Modal -->
  <div class="modal" id="resultModal">
    <div class="modal-content">
      <h3 id="modalTitle">BOŞ ÇÝKDY!</h3>
      <p id="modalMsg">Gynanmaň, indiki gezek hökman bagtyňyz çykar! Ýene bir gezek synanyşyp görüň!</p>
      <button class="modal-btn" onclick="closeModal()">Täzeden synanyş</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Mini App-y doly ekrana ýaýmak

    let balance = 0;
    let selectedTier = 15;
    let currentRotation = 0;
    let isSpinning = false;

    // Translation Texts
    const translations = {
      tk: { spin: "ÇARKI AÝLA", topup: "BALANS DOLDUR", empty: "BOŞ ÇÝKDY!", motivation: "Ajaýyp sowgat gaty golaý geldi! Ýene bir gezek synanyşsaňyz hökman utarsyňyz!", close: "Täzeden synanyş" },
      ru: { spin: "KRUTIT KOLESO", topup: "POPOLNIT BALANS", empty: "PUSTO!", motivation: "Ochen blizko k super prizu! Poprobuyte yeshche raz, vam povezet!", close: "Poprobovat snova" },
      en: { spin: "SPIN WHEEL", topup: "TOP UP STARS", empty: "EMPTY!", motivation: "So close to the grand prize! Try again, luck is on your side!", close: "Try Again" },
      uz: { spin: "AYLANTIRISH", topup: "BALANS NI TOLDIRISH", empty: "BO'SH!", motivation: "Juda yaqin keldingiz! Yana bir bor urinib ko'ring, albatta yutasiz!", close: "Yana urinish" },
      tr: { spin: "ÇARKI ÇEVİR", topup: "BAKİYE YÜKLE", empty: "BOŞ ÇIKTI!", motivation: "Büyük ödüle çok yaklaştın! Bir kez daha dene, şans seninle!", close: "Tekrar Dene" },
      ar: { spin: "إدارة العجلة", topup: "شحن الرصيد", empty: "فارغ!", motivation: "كنت قريباً جداً من الجائزة! حاول مرة أخرى!", close: "حاول مجدداً" },
      az: { spin: "ÇARXI FIRLAT", topup: "BALANSI ARTIR", empty: "BOŞ ÇIXDI!", motivation: "Böyük mükafata çox yaxınlaşdınız! Bir daha cəhd edin!", close: "Yenidən cəhd et" },
      fr: { spin: "TOURNER LA ROUE", topup: "RECHARGER", empty: "VIDE!", motivation: "Si près du grand prix! Réessayez!", close: "Réessayer" },
      kk: { spin: "AÝNALDYRU", topup: "BALANS TOLYQTYRU", empty: "BOŞ!", motivation: "Ülken syylıqqa öte jaqın qaldıńız! Taǵy bir ret basıńız!", close: "Qaıta tekseru" }
    };

    // Çarkyň ähli 10 bölegi diňe BOŞ yazgydan ybarat
    const items = ["❌ BOŞ", "❌ BOŞ", "❌ BOŞ", "❌ BOŞ", "❌ BOŞ", "❌ BOŞ", "❌ BOŞ", "❌ BOŞ", "❌ BOŞ", "❌ BOŞ"];

    const wheel = document.getElementById('wheel');
    function setupWheel() {
      wheel.innerHTML = '';
      items.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = 'wheel-item';
        const angle = index * 36;
        el.style.transform = `rotate(${angle}deg) translate(0, -70px)`;
        el.innerText = item;
        wheel.appendChild(el);
      });
    }
    setupWheel();

    function selectTier(stars, btn) {
      if (isSpinning) return;
      selectedTier = stars;
      document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateUI();
    }

    // 1. HAKYKY TELEGRAM STARS İNVOICE GELMEK ÜÇIN BACKEND-E NÖBAT YAZMAK
    function topUpBalance() {
      // Mini App-dan botyň backend-ine zapros ugradylýar
      tg.sendData(JSON.stringify({
        action: "create_invoice",
        amount: selectedTier
      }));
    }

    // 2. ÇARKY AÝLAMAK
    function spinWheel() {
      if (isSpinning) return;
      
      if (balance < selectedTier) {
        alert("Balansyňyzda ýeterlik Stars ýok! Ilki 'BALANS DOLDUR' düwmesine basyp Telegram Stars satyn alyň.");
        return;
      }

      balance -= selectedTier;
      document.getElementById('balance').innerText = balance;
      isSpinning = true;

      // Random aýlaw (Diňe BOŞ çykýar çünki hemmesi BOŞ)
      const randomExtraAngle = Math.floor(Math.random() * 10) * 36; 
      const spins = 5 * 360; 
      currentRotation += spins + randomExtraAngle;

      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        document.getElementById('resultModal').style.display = 'flex';
      }, 4000);
    }

    function closeModal() {
      document.getElementById('resultModal').style.display = 'none';
    }

    function changeLanguage() {
      updateUI();
    }

    function updateUI() {
      const lang = document.getElementById('langSelect').value;
      const t = translations[lang] || translations['tk'];
      document.getElementById('spinBtn').innerText = `${t.spin} (${selectedTier} ⭐)`;
      document.getElementById('topupBtn').innerText = `${t.topup} (${selectedTier} ⭐)`;
      document.getElementById('modalTitle').innerText = t.empty;
      document.getElementById('modalMsg').innerText = t.motivation;
      document.querySelector('.modal-btn').innerText = t.close;
    }

    // Backend-den töleg geçenden soň balansa Stars goşmak diňlenilýär
    tg.onEvent('mainButtonClicked', function() {});
    
    // Telegram-dan gelen maglumatlary işlemek
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        // Ulanyjy maglumaty alyndy
    }
  </script>
</body>
</html>
